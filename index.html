<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        /* The weather GIF image container */
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        /* UI Control Button Overlay */
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        .btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="controls">
        <button id="toggleBtn" class="btn" onclick="togglePlayback()">⏸ Pause</button>
    </div>

    <!-- Weather Image -->
    <img id="slideshow" src="" alt="Weather Link">

    <script>
        
        const slideshowData = [
            { 
                // WU-US Radar
                url: "https://s.w-x.co/staticmaps/wu/wu/wxtype1200_cur/conus/animate.png", 
                duration: 9000
            },
            { 
                // WU Satellite+Infrared, S.Central
                url: "https://s.w-x.co/staticmaps/wu/wu/satir1200_cur/usasc/animate.png", 
                duration: 7200
            },
            { 
                // WU Radar-Lawton, OK
                url: "https://s.w-x.co/staticmaps/wu/wu/wxtype1200_cur/uslaw/animate.png", 
                duration: 9000
            },
            { 
                // WU Radar-San Antonio, TX
                url: "https://s.w-x.co/staticmaps/wu/wu/wxtype1200_cur/ussat/animate.png", 
                duration: 9000
            },
            { 
                // KETK Live Doppler-ETX
                url: "https://media.psg.nexstardigital.net/ketk/weather/LiveDopplerSkywatch.gif", 
                duration: 9800
            }
        ];

        let currentIndex = 0;
        let isPaused = false; 
        let timeoutId = null; 
        
        const imgElement = document.getElementById("slideshow");
        const toggleBtn = document.getElementById("toggleBtn");

        function changeImage() {
            // Safety clear to ensure overlapping timers never build up
            if (timeoutId) {
                clearTimeout(timeoutId);
            }

            const currentItem = slideshowData[currentIndex];
            
            // Appends a live timestamp string to completely bypass browser image caching issues
            const cacheBuster = "?t=" + new Date().getTime();
            imgElement.src = currentItem.url + cacheBuster;

            // Move to the next index or wrap around to 0
            currentIndex = (currentIndex + 1) % slideshowData.length;

            // Schedule the next image change using the current item's specific duration
            if (!isPaused) {
                timeoutId = setTimeout(changeImage, currentItem.duration);
            }
        }

        function togglePlayback() {
            if (isPaused) {
                isPaused = false;
                toggleBtn.innerText = "⏸ Pause";
                changeImage();
            } else {
                isPaused = true;
                toggleBtn.innerText = "▶ Play";
                if (timeoutId) {
                    clearTimeout(timeoutId);
                }
            }
        }

        changeImage();
    </script>
</body>
</html>
