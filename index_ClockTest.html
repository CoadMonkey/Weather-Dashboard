<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: black; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: Arial, sans-serif;
        }
        
        /* The weather GIF image container */
        img {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }

        /* Clock Container Box */
        .clock-container {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 240px;
            height: 240px;
            background-color: rgba(0, 0, 0, 0.75); /* Darker background for visibility */
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            z-index: 10;
        }

        /* The Clock Face Area */
        .clock {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            position: relative;
        }

        /* Center Pin */
        .clock::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        /* Clock Numbers Styling */
        .num {
            position: absolute;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .num12 { top: 5px; left: 50%; transform: translateX(-50%); }
        .num3  { right: 8px; top: 50%; transform: translateY(-50%); }
        .num6  { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .num9  { left: 8px; top: 50%; transform: translateY(-50%); }

        /* Clock Hands Base Style */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 6px;
            background-color: #ffffff;
        }

        /* Clock Hands */
        .hour {
            width: 6px;
            height: 55px;
            margin-left: -3px;
        }

        .minute {
            width: 4px;
            height: 85px;
            background-color: #e5e5e5;
            margin-left: -2px;
        }
    </style>
</head>
<body>

    <!-- Weather Image -->
    <img id="slideshow" src="" alt="Weather Link">

    <!-- Doubled Analog Clock Overlay with Numbers -->
    <div class="clock-container">
        <div class="clock">
            <div class="num num12">12</div>
            <div class="num num3">3</div>
            <div class="num num6">6</div>
            <div class="num num9">9</div>

            <div class="hand hour" id="hour-hand"></div>
            <div class="hand minute" id="minute-hand"></div>
			<!-- <div class="hand second" id="second-hand"></div> -->
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURATION
        // ==========================================
        const images = [
            "https://s.w-x.co/staticmaps/wu/wu/wxtype1200_cur/conus/animate.png",
			"https://s.w-x.co/staticmaps/wu/fee4c/satrd_5km_cur/usa/20261017/0305z.jpg",
			"https://s.w-x.co/staticmaps/wu/fee4c/temp_cur/tyr/20261017/0300z.jpg",
			"https://s.w-x.co/staticmaps/wu/fee4c/feelslike_cur/tyr/20261017/0300z.jpg",
            "https://s.w-x.co/staticmaps/wu/wu/wxtype1200_cur/uslaw/animate.png",
            "https://s.w-x.co/staticmaps/wu/wu/wxtype1200_cur/ussat/animate.png",
            "https://s.w-x.co/staticmaps/wu/wu/satir1200_cur/usasc/animate.png"
        ];

        const rotationSpeed = 6000; // Time interval (10000ms = 10 seconds)

        // ==========================================
        // 2. SLIDESHOW LOGIC
        // ==========================================
        let currentIndex = 0;
        const imgElement = document.getElementById("slideshow");

        function changeImage() {
            // Appends a live timestamp string to completely bypass browser image caching issues
            const cacheBuster = "?t=" + new Date().getTime();
            imgElement.src = images[currentIndex] + cacheBuster;
            currentIndex = (currentIndex + 1) % images.length;
        }

        // ==========================================
        // 3. ANALOG CLOCK LOGIC
        // ==========================================
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');

        function updateClock() {
            const now = new Date();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            // Calculate exact position angles for a smooth sweep
            const minutesDegrees = (minutes / 60) * 360;
            const hoursDegrees = ((hours % 12) / 12) * 360 + ((minutes / 60) * 30);

            // Apply positions
            minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;
            hourHand.style.transform = `rotate(${hoursDegrees}deg)`;
        }

        // ==========================================
        // Main
        // ==========================================

		// Slideshow
        changeImage();
        setInterval(changeImage, rotationSpeed);

        // Clock
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
